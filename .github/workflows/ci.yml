name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Required gate: the Python version UniqueOS (our primary consumer) runs on.
  test:
    name: test (3.14 · required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/
        continue-on-error: true

      - name: Type check
        run: mypy src/
        continue-on-error: true

      - name: Test
        run: pytest --cov=pyfreepbx --cov-report=term-missing

  # Informational compatibility matrix for published-library support
  # (>=3.10). Non-blocking: failures here do not gate a merge.
  compat:
    name: compat (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q
